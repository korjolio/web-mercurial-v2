<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><title>Mercurial · Desgravamen v2</title>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#aaa;padding:40px;display:flex;flex-direction:column;gap:40px}.f{width:1080px;height:1350px;flex:none;position:relative;overflow:hidden;font-family:'Albert Sans',sans-serif;background:#0d2340;color:white;padding:62px 76px 110px;display:flex;flex-direction:column;--accent:#8bd5ee}.light{background:#f4f7f9;color:#0d2340;--accent:#1a7ca4}.blue{background:#1a7ca4;--accent:#fff}.paper{background:#e7f0f5;color:#0d2340;--accent:#1a7ca4}.logo{background:white;border-radius:15px;padding:13px 20px;width:274px;height:92px;display:flex;align-items:center}.logo img{width:100%;height:100%;object-fit:contain}.top{display:flex;justify-content:space-between;align-items:center}.edition{font-size:23px;font-weight:600;text-align:right;line-height:1.25}.filter{margin-top:38px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;padding:18px 0;font-size:35px;line-height:1.15;font-weight:800}.filter strong{color:var(--accent)}.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0}.eyebrow{font-size:22px;letter-spacing:2px;font-weight:700;color:var(--accent);margin-bottom:24px}h1{font-size:76px;line-height:1.02;letter-spacing:-3px;font-weight:800;max-width:920px}.foco{font-size:37px;line-height:1.18;font-weight:700;margin-top:30px;padding-left:23px;border-left:6px solid var(--accent)}.detail{font-size:29px;line-height:1.3;margin-top:28px;max-width:900px}.bottom{border-top:1px solid currentColor;padding-top:20px}.dato{font-size:25px;font-weight:500;margin-bottom:16px}.cta{display:flex;justify-content:space-between;align-items:center;font-size:32px;font-weight:800;color:var(--accent)}.cta span{font-size:44px}.exclusion{font-size:22px;line-height:1.3;margin-top:16px}.reg{position:absolute;bottom:30px;left:76px;right:76px;border-top:1px solid currentColor;padding-top:10px;font-size:18px;line-height:1.25}.story{height:1920px;padding-top:260px;padding-bottom:340px}.story .filter{margin-top:48px}.story h1{font-size:85px;line-height:1.04}.story .foco{font-size:40px;margin-top:40px}.story .detail{font-size:33px;margin-top:36px}.story .main{padding:46px 0}.story .reg{bottom:265px}.story .bottom{padding-top:25px}.story .exclusion{font-size:24px}.story .dato{font-size:28px}
</style></head><body><div id="root" style="display:contents"></div><script src="posts.js"></script><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REG='Mercurial Corredores de Seguros Ltda. · Corredora inscrita en la CMF, Registro N° 8929 · No somos aseguradora: las pólizas las emiten las compañías de seguros.';
const id=new URLSearchParams(location.search).get('id');
document.querySelector('#root').innerHTML=window.POSTS.filter(p=>!id||p.id===id).flatMap(p=>['feed','story'].map(format=>`<article class="f ${p.tema} ${format}" data-nombre="${p.id}-${format}"><header class="top"><div class="logo"><img src="../../../src/img/Mercurial Grande Sin Fondo.png" alt="Mercurial"></div><div class="edition">DESGRAVAMEN<br>HIPOTECARIO PLUS · AuguStar</div></header><div class="filter">Solo créditos hipotecarios <strong>NUEVOS</strong></div><section class="main"><div class="eyebrow">${esc(p.etiqueta)}</div><h1>${esc(p.titulo)}</h1><p class="foco">${esc(p.foco)}</p><p class="detail">${esc(p.detalle)}</p></section><section class="bottom"><p class="dato">${esc(p.dato)}</p><div class="cta">${esc(p.cta)}<span>→</span></div><p class="exclusion">No aplica a hipotecarios vigentes ni a cobros o reclamos de seguros.</p></section><footer class="reg">${REG}</footer></article>`)).join('');
</script></body></html>
