<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><title>Mercurial · Desgravamen v3</title>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#555;padding:40px;display:flex;flex-direction:column;gap:40px}.f{width:1080px;height:1350px;position:relative;overflow:hidden;flex:none;font-family:'Albert Sans',sans-serif;background:#0d2340;color:white}.photo{position:absolute;inset:0 0 auto;height:860px;background-size:cover;background-repeat:no-repeat}.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#0d2340 100%)}.content{position:absolute;left:64px;right:64px;bottom:120px}.logo{width:300px;height:58px;margin-bottom:23px}.logo img{width:100%;height:100%;object-fit:contain}.filter{position:absolute;top:46px;left:64px;display:inline-block;font-size:28px;line-height:1.2;font-weight:700;background:#1a7ca4;padding:9px 14px;margin-bottom:25px}h1{font-size:94px;line-height:.98;letter-spacing:-2.7px;font-weight:800;white-space:pre-line}.alivio{font-size:30px;line-height:1.2;margin-top:23px;max-width:930px;color:#d9ebf4}.cta{display:inline-block;font-size:33px;line-height:1.2;font-weight:800;color:#0d2340;background:white;padding:15px 24px;margin-top:26px}.reg{position:absolute;left:64px;right:64px;bottom:30px;font-size:21px;line-height:1.35;color:#d9ebf4}.story{height:1920px}.story .photo{height:1330px}.story .content{bottom:385px}.story h1{font-size:104px;line-height:1}.story .logo{width:330px;height:64px;margin-bottom:27px}.story .filter{top:260px;font-size:30px;margin-bottom:28px}.story .alivio{font-size:32px;margin-top:28px}.story .cta{font-size:36px;margin-top:28px}.story .reg{bottom:265px;font-size:23px}.concepto-1 h1,.concepto-3 h1{font-size:84px}.story.concepto-1 h1,.story.concepto-3 h1{font-size:94px}.casa h1{color:#fff}.alternativa h1{color:#fff}
</style></head><body><div id="root" style="display:contents"></div><script src="posts.js"></script><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REG='Cobertura sujeta a evaluación y aceptación de la aseguradora. El banco debe aceptar la póliza.<br>Mercurial Corredores de Seguros · Corredora inscrita en la CMF, Registro N° 8929';
const id=new URLSearchParams(location.search).get('id');
document.querySelector('#root').innerHTML=window.POSTS.filter(p=>!id||p.id===id).flatMap(p=>['feed','story'].map(format=>`<article class="f ${p.clase} ${format}" data-nombre="${p.id}-${format}"><div class="photo" style="background-image:url('${p.foto}');background-position:${format==='story'&&p.encuadreStory||p.encuadre}"></div><p class="filter">Compra o refinanciamiento hipotecario</p><section class="content"><div class="logo"><img src="logos/mercurial-blanco.png" alt="Mercurial Corredores de Seguros"></div><h1>${esc(p.titulo)}</h1><p class="alivio">${esc(p.alivio)}</p><div class="cta">${esc(p.cta)}</div></section><footer class="reg">${REG}</footer></article>`)).join('');
</script></body></html>
