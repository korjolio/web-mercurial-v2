<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Plantilla Instagram · Mercurial</title>
<!-- Misma línea visual que las piezas de Ads de desgravamen (navy, titular serif, acento azul). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Source+Sans+3:wght@400;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --navy: #0f2a4a;
    --navy-2: #13345a;
    --acento: #2399C6;
    --acento-claro: #5cc0e6;
    --tinta: #ffffff;
    --suave: #c3d0df;
    --tenue: #8fa3bb;
    --pad: 84px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #222; }
  .post {
    position: relative; overflow: hidden;
    width: 1080px; height: 1350px;
    background: var(--navy); color: var(--tinta);
    font-family: 'Source Sans 3', sans-serif;
    padding: 64px var(--pad) 64px;
    display: flex; flex-direction: column;
  }
  .logo {
    align-self: flex-start; position: relative; z-index: 2;
    background: #fff; border-radius: 30px; padding: 22px 26px;
  }
  .logo img { display: block; height: 52px; }
  .eyebrow {
    position: relative; z-index: 2;
    margin-top: 64px; font-size: 32px; font-weight: 600; color: var(--acento-claro);
    letter-spacing: .01em;
  }
  h1 {
    position: relative; z-index: 2;
    font-family: 'Source Serif 4', serif; font-weight: 700;
    font-size: 92px; line-height: 1.04; letter-spacing: -.02em;
    margin-top: 28px; max-width: 880px; text-wrap: balance;
  }
  h1 em, .bajada em { font-style: normal; color: var(--acento); }
  .bajada {
    position: relative; z-index: 2;
    font-size: 40px; line-height: 1.3; color: var(--suave);
    margin-top: 40px; max-width: 820px; text-wrap: pretty;
  }
  .pie { margin-top: auto; position: relative; z-index: 2; }
  .cta {
    font-size: 38px; font-weight: 700; line-height: 1.2;
    display: flex; align-items: center; gap: 18px;
  }
  .cta::before {
    content: ''; width: 56px; height: 6px; border-radius: 3px; background: var(--acento); flex: none;
  }
  .legal { margin-top: 22px; font-size: 23px; line-height: 1.35; color: var(--tenue); max-width: 900px; }

  /* Foto de fondo: ocupa la parte baja y se funde con el navy arriba y abajo */
  /* ajustarFotos() fija --foto-top justo bajo el texto para que nunca quede encima de la imagen */
  .foto {
    position: absolute; z-index: 0; left: 0; right: 0; bottom: 0; top: var(--foto-top, 36%);
    background-size: cover; background-position: center 30%;
  }
  .foto::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, var(--navy) 0, rgba(15,42,74,.55) 90px, rgba(15,42,74,0) 260px, rgba(15,42,74,0) 55%, rgba(15,42,74,.6) 80%, var(--navy) 97%);
  }
  .panel {
    background: rgba(15,42,74,.74); border: 1.5px solid rgba(255,255,255,.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }

  .l-foto h1 { font-size: 86px; }
  .l-foto .bajada { font-size: 36px; margin-top: 28px; }

  /* lista */
  .l-lista h1 { font-size: 72px; }
  .items { position: relative; z-index: 2; margin-top: 44px; display: grid; gap: 24px; border-radius: 28px; padding: 36px 40px 36px 32px; }
  .item { display: grid; grid-template-columns: 64px 1fr; align-items: baseline; }
  .item .n { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 48px; color: var(--acento-claro); line-height: 1; }
  .item h2 { font-size: 36px; font-weight: 700; line-height: 1.15; }
  .item p { font-size: 28px; line-height: 1.28; color: var(--suave); margin-top: 4px; }

  /* planes */
  .l-planes h1 { font-size: 76px; }
  .l-planes .eyebrow { margin-top: 52px; }
  .planes { position: relative; z-index: 2; margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .plan {
    border-radius: 26px; padding: 26px 24px 26px; display: flex; flex-direction: column;
  }
  .plan.destacado { border-color: var(--acento); }
  .plan .nombre { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 42px; }
  .plan .rot { font-size: 22px; color: var(--tenue); margin-top: 14px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .plan .pct { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 82px; line-height: 1; color: var(--acento-claro); margin-top: 6px; }
  .plan .tope { font-size: 28px; font-weight: 600; margin-top: 4px; }
  .plan ul { list-style: none; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); display: grid; gap: 10px; }
  .plan li { font-size: 24px; line-height: 1.22; color: var(--suave); }
  .nota { position: relative; z-index: 2; margin-top: 28px; font-size: 27px; line-height: 1.35; color: var(--suave); max-width: 900px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="posts.js"></script>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const acento = s => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');

  function render(p) {
    const cabeza = `
      <div class="logo"><img src="../src/img/Mercurial Grande Sin Fondo.png" alt="Mercurial Corredores de Seguros"></div>
      <div class="eyebrow">${esc(p.eyebrow)}</div>
      <h1>${acento(p.titulo)}</h1>`;
    const pie = `<div class="pie">
      <div class="cta">${esc(p.cta)}</div>
      ${p.legal ? `<p class="legal">${esc(p.legal)}</p>` : ''}
    </div>`;

    let cuerpo = '';
    if (p.layout === 'lista') {
      cuerpo = `<div class="items panel">${p.items.map(([t, d], i) => `
        <div class="item"><span class="n">${i + 1}</span><div><h2>${esc(t)}</h2><p>${esc(d)}</p></div></div>`).join('')}</div>`;
    } else if (p.layout === 'foto') {
      cuerpo = `<p class="bajada">${acento(p.bajada)}</p>`;
    } else if (p.layout === 'planes') {
      cuerpo = `<div class="planes">${p.planes.map((pl, i) => `
        <div class="plan panel${i === 1 ? ' destacado' : ''}">
          <div class="nombre">${esc(pl.nombre)}</div>
          <div class="rot">Urgencias</div>
          <div class="pct">${esc(pl.pct)}</div>
          <div class="tope">${esc(pl.tope)}</div>
          <ul><li>${esc(pl.rc)}</li><li>${esc(pl.med)}</li><li>${esc(pl.extra)}</li></ul>
        </div>`).join('')}</div>
        <p class="nota">${esc(p.nota)}</p>`;
    }

    const fondo = `<div class="foto" style="background-image:url('${encodeURI(p.foto)}');${p.encuadre ? `background-position:${p.encuadre}` : ''}"></div>`;

    return `<div class="post l-${p.layout}">${fondo}${cabeza}${cuerpo}${pie}</div>`;
  }

  const id = new URLSearchParams(location.search).get('id');
  const lista = id ? window.POSTS.filter(p => p.id === id) : window.POSTS;
  document.getElementById('root').innerHTML = lista.map(render).join('');

  // La foto parte donde termina el texto (bajada en 'foto'; título en lista y planes, cuyos paneles van encima)
  window.ajustarFotos = () => document.querySelectorAll('.post').forEach(post => {
    const ref = post.querySelector('.bajada') || post.querySelector('h1');
    const fin = ref.getBoundingClientRect().bottom - post.getBoundingClientRect().top;
    post.querySelector('.foto').style.setProperty('--foto-top', `${Math.round(fin - 60)}px`);
  });
  document.fonts.ready.then(window.ajustarFotos);
</script>
</body>
</html>
