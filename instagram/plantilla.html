<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Plantilla Instagram · Mercurial</title>
<!-- Línea visual de las piezas de Ads de desgravamen (navy, titular serif, acento azul), con cinco formatos
     que se alternan en el feed. Cada .f es una imagen de 1080×1350; render.js captura cada una por su data-nombre. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Source+Sans+3:wght@400;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --navy: #0f2a4a;
    --acento: #2399C6;
    --acento-claro: #5cc0e6;
    --crema: #f3efe7;
    --suave: #c3d0df;
    --gris: #3c5470;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; display: flex; flex-direction: column; gap: 40px; padding: 40px; }
  .f {
    position: relative; overflow: hidden; flex: none;
    width: 1080px; height: 1350px; padding: 64px 84px;
    display: flex; flex-direction: column;
    font-family: 'Source Sans 3', sans-serif; color: var(--navy);
  }
  .serif { font-family: 'Source Serif 4', serif; font-weight: 700; letter-spacing: -.02em; }
  em { font-style: normal; }
  .z { position: relative; z-index: 2; }

  .logo { align-self: flex-start; background: #fff; border-radius: 24px; padding: 16px 20px; position: relative; z-index: 2; }
  .logo img { display: block; height: 40px; }
  .claro .logo { box-shadow: 0 0 0 2px rgba(15,42,74,.08); }

  .chip {
    align-self: flex-start; display: inline-block; position: relative; z-index: 2;
    font-size: 26px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 999px; background: var(--navy); color: #fff;
  }
  .cta { font-size: 34px; font-weight: 700; display: flex; align-items: center; gap: 16px; position: relative; z-index: 2; }
  .cta::before { content: ''; flex: none; width: 52px; height: 6px; border-radius: 3px; background: currentColor; }
  .legal { font-size: 22px; line-height: 1.35; margin-top: 18px; opacity: .75; position: relative; z-index: 2; }
  .credito {
    position: absolute; z-index: 3; right: 18px; bottom: 14px;
    font-size: 17px; color: #fff; background: rgba(15,42,74,.55); padding: 4px 10px; border-radius: 6px;
  }

  /* Foto a sangre (portada y portada de carrusel) */
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(15,42,74,.55) 0, rgba(15,42,74,0) 22%, rgba(15,42,74,0) 38%, rgba(15,42,74,.82) 66%, var(--navy) 100%);
  }

  /* A · portada */
  .portada { color: #fff; background: var(--navy); }
  .portada .txt { margin-top: auto; position: relative; z-index: 2; }
  .portada .chip { background: var(--acento); }
  .portada h1 { font-size: 100px; line-height: 1.02; margin: 26px 0 0; text-wrap: balance; }
  .portada h1 em { color: var(--acento-claro); }
  .portada .bajada { font-size: 38px; line-height: 1.25; color: var(--suave); margin-top: 24px; max-width: 860px; }
  .portada .cta { margin-top: 40px; }

  /* B · dato */
  .dato { background: var(--acento); }
  .dato .chip { margin-top: 72px; }
  .dato .num { font-size: 400px; line-height: .8; margin-top: 80px; letter-spacing: -.05em; white-space: nowrap; }
  .dato .num small { font-size: 120px; letter-spacing: -.02em; margin-left: 18px; }
  .dato p { font-size: 50px; line-height: 1.2; font-weight: 600; margin-top: 64px; max-width: 880px; position: relative; z-index: 2; }
  .dato .cta { margin-top: auto; }
  .iso { position: absolute; z-index: 1; right: -90px; bottom: -60px; width: 520px; color: #fff; opacity: .16; }

  /* C · pregunta */
  .pregunta { background: var(--crema); }
  .pregunta .chip { margin-top: 60px; }
  .pregunta h1 { font-size: 88px; line-height: 1.04; margin-top: 28px; text-wrap: balance; }
  .pregunta h1 em { color: var(--acento); }
  .pregunta .bajada { font-size: 36px; line-height: 1.25; color: var(--gris); margin-top: 20px; }
  .pregunta .marco { margin-top: 40px; flex: 1; border-radius: 36px; background-size: cover; position: relative; overflow: hidden; }
  .pregunta .cta { margin-top: 36px; }

  /* D · split */
  .split { padding: 0; background: #fff; }
  .split .foto { height: 640px; flex: none; background-size: cover; position: relative; padding: 64px 84px; display: flex; flex-direction: column; }
  .split .abajo { flex: 1; padding: 60px 84px 64px; display: flex; flex-direction: column; position: relative; }
  .split .abajo::before { content: ''; position: absolute; left: 84px; top: -8px; width: 140px; height: 16px; background: var(--acento); border-radius: 8px; }
  .split .chip { background: transparent; color: var(--acento); padding: 0; letter-spacing: .04em; }
  .split h1 { font-size: 80px; line-height: 1.05; margin-top: 18px; text-wrap: balance; }
  .split h1 em { color: var(--acento); }
  .split .bajada { font-size: 36px; line-height: 1.3; color: var(--gris); margin-top: 24px; }
  .split .cta { margin-top: auto; }

  /* E · carrusel */
  .dots { display: flex; gap: 10px; position: relative; z-index: 2; }
  .dots i { width: 14px; height: 14px; border-radius: 7px; background: currentColor; opacity: .4; }
  .dots i.on { opacity: 1; width: 40px; }
  .car-portada { color: #fff; background: var(--navy); }
  .car-portada .dots { position: absolute; top: 88px; right: 84px; }
  .car-portada .txt { margin-top: auto; position: relative; z-index: 2; }
  .car-portada .chip { background: #fff; color: var(--navy); }
  .car-portada h1 { font-size: 104px; line-height: 1.02; margin: 26px 0 36px; text-wrap: balance; }
  .car-portada h1 em { color: var(--acento-claro); }
  .desliza { font-size: 34px; font-weight: 700; }

  .lamina { background: var(--crema); }
  .lamina .n { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 260px; line-height: .8; color: var(--acento); margin-top: auto; letter-spacing: -.04em; }
  .lamina h2 { font-size: 96px; line-height: 1.04; margin-top: 56px; text-wrap: balance; }
  .lamina p { font-size: 46px; line-height: 1.3; color: var(--gris); margin-top: 36px; max-width: 880px; text-wrap: pretty; }
  /* El contenido de las láminas queda centrado en el alto: margin-top:auto arriba y en los dots */
  .lamina .dots, .plan .dots, .cierre .dots { margin-top: auto; }

  .plan { background: var(--crema); }
  .plan .rot { font-size: 30px; font-weight: 700; color: var(--acento); margin-top: auto; }
  .plan h2 { font-size: 150px; line-height: 1; margin-top: 10px; }
  .plan .big { display: flex; align-items: baseline; gap: 24px; margin-top: 56px; border-top: 3px solid var(--navy); padding-top: 44px; }
  .plan .big b { font-family: 'Source Serif 4', serif; font-size: 220px; line-height: .85; color: var(--acento); letter-spacing: -.04em; }
  .plan .big span { font-size: 44px; font-weight: 700; line-height: 1.15; }
  .plan ul { list-style: none; margin-top: 56px; display: grid; gap: 22px; }
  .plan li { font-size: 40px; display: flex; gap: 18px; }
  .plan li::before { content: ''; flex: none; width: 18px; height: 18px; border-radius: 9px; background: var(--acento); margin-top: 14px; }

  .cierre { background: var(--navy); color: #fff; }
  .cierre h2 { font-size: 104px; line-height: 1.02; margin-top: auto; text-wrap: balance; }
  .cierre h2 em { color: var(--acento-claro); }
  .cierre p { font-size: 42px; line-height: 1.3; color: var(--suave); margin-top: 36px; max-width: 880px; }
  .cierre .cta { margin-top: 64px; font-size: 40px; color: var(--acento-claro); }
  .cierre .cta + .legal { margin-top: 28px; }
  .cierre .dots { color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script src="posts.js"></script>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const acento = s => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const LOGO = `<div class="logo"><img src="../src/img/Mercurial Grande Sin Fondo.png" alt="Mercurial Corredores de Seguros"></div>`;
  const ISO = `<svg class="iso" viewBox="0 0 284 307" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="57" height="205"/><rect x="57" y="0" width="56" height="102"/><rect x="113" y="102" width="57" height="128"/><rect x="170" y="0" width="114" height="102"/><rect x="227" y="102" width="57" height="205"/></svg>`;

  const fondo = (foto, encuadre) => `background-image:url('${encodeURI(foto)}');background-position:${encuadre || 'center'}`;
  const credito = foto => {
    const c = window.CREDITOS[foto.split('/').pop()];
    return c ? `<span class="credito">Foto: ${esc(c)}</span>` : '';
  };
  const legal = t => t ? `<p class="legal">${esc(t)}</p>` : '';
  const dots = (n, i) => `<div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>`;
  const frame = (nombre, clase, html) => `<div class="f ${clase}" data-nombre="${nombre}">${html}</div>`;

  const FORMATOS = {
    portada: p => [frame(p.id, 'portada', `
      <div class="bg" style="${fondo(p.foto, p.encuadre)}"></div>${LOGO}
      <div class="txt"><span class="chip">${esc(p.chip)}</span>
        <h1 class="serif">${acento(p.titulo)}</h1>
        ${p.bajada ? `<p class="bajada">${acento(p.bajada)}</p>` : ''}
        <div class="cta">${esc(p.cta)}</div>${legal(p.legal)}</div>${credito(p.foto)}`)],

    dato: p => [frame(p.id, 'dato', `${ISO}${LOGO}
      <span class="chip">${esc(p.chip)}</span>
      <div class="num serif z">${esc(p.num)}<small>${esc(p.unidad)}</small></div>
      <p>${acento(p.texto)}</p>
      <div class="cta">${esc(p.cta)}</div>`)],

    pregunta: p => [frame(p.id, 'pregunta claro', `${LOGO}
      <span class="chip">${esc(p.chip)}</span>
      <h1 class="serif">${acento(p.titulo)}</h1>
      ${p.bajada ? `<p class="bajada">${acento(p.bajada)}</p>` : ''}
      <div class="marco" style="${fondo(p.foto, p.encuadre)}">${credito(p.foto)}</div>
      <div class="cta">${esc(p.cta)}</div>`)],

    split: p => [frame(p.id, 'split claro', `
      <div class="foto" style="${fondo(p.foto, p.encuadre)}">${LOGO}${credito(p.foto)}</div>
      <div class="abajo"><span class="chip">${esc(p.chip)}</span>
        <h1 class="serif">${acento(p.titulo)}</h1>
        ${p.bajada ? `<p class="bajada">${acento(p.bajada)}</p>` : ''}
        <div class="cta">${esc(p.cta)}</div>${legal(p.legal)}</div>`)],

    carrusel: p => {
      const total = p.laminas.length + 2;
      const out = [frame(`${p.id}-1`, 'car-portada', `
        <div class="bg" style="${fondo(p.portada.foto, p.portada.encuadre)}"></div>${LOGO}${dots(total, 0)}
        <div class="txt"><span class="chip">${esc(p.portada.chip)}</span>
          <h1 class="serif">${acento(p.portada.titulo)}</h1>
          <div class="desliza">${esc(p.portada.desliza || 'Desliza')} →</div></div>${credito(p.portada.foto)}`)];
      p.laminas.forEach((l, i) => {
        const nombre = `${p.id}-${i + 2}`;
        out.push(l.plan
          ? frame(nombre, 'plan claro', `${LOGO}
              <div class="rot">Plan ${i + 1} de ${p.laminas.length}</div>
              <h2 class="serif">${esc(l.plan)}</h2>
              <div class="big"><b>${esc(l.pct)}</b><span>en urgencias<br>${esc(l.tope)}</span></div>
              <ul>${l.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${dots(total, i + 1)}`)
          : frame(nombre, 'lamina claro', `${LOGO}
              <div class="n">${String(i + 1).padStart(2, '0')}</div>
              <h2 class="serif">${acento(l.titulo)}</h2>
              <p>${acento(l.texto)}</p>${dots(total, i + 1)}`));
      });
      const c = p.cierre;
      out.push(frame(`${p.id}-${total}`, 'cierre', `${LOGO}
        <h2 class="serif">${acento(c.titulo)}</h2>
        ${c.texto ? `<p>${acento(c.texto)}</p>` : ''}
        <div class="cta">${esc(c.cta)}</div>${legal(c.legal)}${dots(total, total - 1)}`));
      return out;
    },
  };

  const id = new URLSearchParams(location.search).get('id');
  const lista = id ? window.POSTS.filter(p => p.id === id) : window.POSTS;
  document.getElementById('root').innerHTML = lista.flatMap(p => FORMATOS[p.formato](p)).join('');
</script>
</body>
</html>
